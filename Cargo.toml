[package]
name = "lipid"
version = "0.7.1"
authors = ["Giorgi Vladimirovich Kazakov", "Roman Alexandrovich Sidorov"]
edition = "2024"

[dependencies]
polars = { git = "https://github.com/pola-rs/polars", rev = "bf6a425", default-features = false, features = [
    "abs",
    "cum_agg",
    "dtype-i128",
    "dtype-i8",
    "dtype-struct",
    "dtype-u8",
    "fmt_no_tty",
    "is_in",
    "lazy",
    "list_arithmetic",
    "list_eval",
    "log",
    "round_series",
    "serde-lazy",
    #
    # "concat_str",
    # "strings",
    #
    # "list_sets",
] }
serde = { version = "1.0.228", features = ["derive", "std"], optional = true }

atom = { git = "https://github.com/ippras/atom" }
fatty_acid_macro = { git = "https://github.com/ippras/fatty_acid_macro" }
polars_ext = { git = "https://github.com/kgv/polars_ext", branch = "bf6a425" }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
harness = false
name = "compare"
# name = "expr"

[features]
default = [
    "atomic",
    "biodiesel",
    "ecl",
    "ecn",
    "indices",
    "map",
    "mass",
    "select",
]

atomic = []
biodiesel = []
ecl = []
ecn = []
indices = []
map = []
mass = []
select = []
